<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ورقة للطلاب: ذاكر، لخّص دروسك، حل امتحانات المعلمين وتابع درجاتك.">
<title>ورقة للطلاب | ذاكر وحل واطمّن على مستواك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#20264b;--muted:#7e87a0;--brand:#5d54df;--soft:#f0efff;--mint:#e7f8f3;--line:#e8e9f1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f7f8fd;color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a89ff6;outline-offset:3px}
a{color:var(--brand);text-decoration:none;font-weight:700}
.top{height:70px;display:flex;justify-content:space-between;align-items:center;padding:12px max(20px,calc((100vw - 1140px)/2));border-bottom:1px solid var(--line);background:white;gap:15px}
.logo{font-size:23px;font-weight:800;color:var(--brand)}
.logo small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.top-links{display:flex;gap:14px;align-items:center;font-size:13px;flex-wrap:wrap}
main{max-width:1140px;margin:0 auto;padding:26px 19px 80px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px}
nav{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px;height:max-content}
nav button{width:100%;display:flex;align-items:center;gap:9px;background:transparent;text-align:right;color:#5c6789;padding:13px;border-radius:11px;font-weight:700}
nav button.active{background:var(--soft);color:var(--brand)}
nav .nav-note{font-size:12px;color:var(--muted);padding:10px;line-height:1.9}
.hero{padding:25px 28px;border-radius:22px;background:linear-gradient(115deg,#5750d4,#897af3);color:#fff;margin-bottom:19px}
.hero h1{font-size:28px;margin:0 0 8px}
.hero p{margin:0;color:#f1edff}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 9px 27px #33336607}
.card h2,.card h3{margin:0 0 12px}
.card p{color:#66708d}
.field{width:100%;background:#fff;border:1px solid #daddea;padding:11px 13px;border-radius:10px;outline:none;color:var(--ink)}
textarea.field{min-height:165px;resize:vertical;line-height:1.8}
.field:focus{border-color:var(--brand)}
.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
label{font-weight:700;font-size:13px;display:block;margin-bottom:6px}
.label-group{margin-bottom:14px}
button.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;background:var(--brand);color:white;padding:11px 17px;border-radius:11px;font-weight:800}
button.btn:disabled{opacity:.55;cursor:not-allowed}
button.btn.secondary{background:var(--soft);color:var(--brand)}
button.btn.outline{background:#fff;color:var(--brand);border:1px solid #dedcf9}
.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.muted,.helper{font-size:13px;color:var(--muted)}
.notice{padding:12px 15px;background:#f2f0ff;color:#37317f;border-radius:12px;margin:11px 0;font-size:13px}
.notice.warn{background:#fff5e9;color:#835016}
.big{font-size:22px;font-weight:800}
.quiz-q{border:1px solid #e9e9f5;border-radius:14px;padding:17px;margin:13px 0;background:#fdfdff}
.quiz-q legend{font-size:15px;font-weight:800;line-height:1.7}
.choice{display:flex;gap:11px;align-items:flex-start;border:1px solid #e6e7ef;border-radius:9px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}
.choice input{accent-color:var(--brand);margin-top:7px}
.bullets{padding-right:23px}.bullets li{margin-bottom:10px}
.flashcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flash{padding:15px;background:var(--mint);border:1px solid #cceee3;border-radius:13px}
.flash strong,.flash span{display:block}
.flash span{margin-top:8px}
.summary{background:#f9faff;padding:18px;border-radius:12px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}
.result-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:14px 2px;flex-wrap:wrap}
.score{font-size:22px;color:var(--brand);font-weight:800}
.scorebar{height:7px;background:#eceafa;border-radius:10px;overflow:hidden;width:100%;margin-top:6px}
.scorebar span{display:block;background:#4cb99f;height:100%}
.auth-wrap{max-width:880px;margin:27px auto;display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:24px;overflow:hidden;box-shadow:0 24px 50px #2b2d6a14}
.auth-art{background:linear-gradient(145deg,#514ccc,#837afa);color:#fff;padding:44px 33px;display:flex;flex-direction:column;justify-content:center}
.auth-art h1{font-size:34px;line-height:1.4;margin:0 0 16px}
.auth-art p{color:#eeeaff}
.auth-pane{background:white;padding:36px 30px}
.auth-pane h2{margin:5px 0 10px}
.auth-tabs{display:flex;gap:8px;margin:20px 0}
.auth-tabs button{flex:1;padding:9px;border-radius:10px;background:#f3f3fb;font-weight:700;color:#5c6789}
.auth-tabs button.active{background:var(--brand);color:white}
.auth-pane .btn{width:100%}
.empty{text-align:center;padding:25px;color:var(--muted)}
#waraqa-alert{min-height:0}
.loading{font-weight:700;color:var(--brand)}
@media(max-width:840px){.layout{grid-template-columns:1fr}nav{display:flex;gap:5px;overflow-x:auto;padding:8px}nav button{white-space:nowrap;width:auto;padding:10px 12px}nav .nav-note{display:none}}
@media(max-width:650px){.top{height:auto;min-height:65px;padding:12px 16px}.top-links{font-size:12px}main{padding:18px 13px 55px}.auth-wrap{grid-template-columns:1fr;margin:0}.auth-art{padding:28px}.auth-art h1{font-size:24px}.auth-pane{padding:26px 20px}.card{padding:18px}.hero{padding:22px}.hero h1{font-size:23px}.grid-two,.flashcards{grid-template-columns:1fr}.big{font-size:19px}}

/* Waraqa student camera lesson */
.tutor-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;margin:12px 0 19px}
.tutor-thumb{display:flex;flex-direction:column;gap:7px;padding:7px;border:1px solid var(--line);border-radius:12px;background:#fafbff}
.tutor-thumb img{width:100%;height:105px;object-fit:contain;border-radius:8px;background:#fff}
.tutor-thumb .btn{font-size:12px;padding:4px 8px}
.tutor-progress{font-size:13px;color:var(--brand);font-weight:700;padding:12px 0 20px}
.tutor-game-option{width:100%;display:block;text-align:right;margin:10px 0;border:1px solid #dadcf0;background:#fff;color:#272b59;padding:14px;border-radius:12px;font-weight:700;line-height:1.65}
.tutor-game-option.selected{border-color:#5d54df;background:#f0efff}
.tutor-game-option:disabled{cursor:default;opacity:.85}
.tutor-answer{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}

</style>
</head>
<body>
<header class="top">
 <a href="/student.html" class="logo">▤ ورقة <small>بوابة الطالب الذكية</small></a>
 <div class="top-links"><a href="/">👩‍🏫 بوابة المعلم</a><span id="student-nav-user"></span></div>
</header>
<main><div id="waraqa-alert" role="status" aria-live="polite"></div><div id="student-app"><div class="empty">جارٍ تجهيز بوابة الطلاب...</div></div></main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script defer src="./student-portal.js"></script>
<script defer src="./student-tutor.js"></script>
</body>
</html>
