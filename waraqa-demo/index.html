async function dbAllIDB(){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('exams','readonly');const r=t.objectStore('exams').getAll();r.onsuccess=()=>resolve((r.result||[]).sort((a,b)=>b.createdAt-a.createdAt));r.onerror=()=>reject(r.error)})}
async function dbPutIDB(v){const d=await db();return new Promise((resolve,reject)=>{const r=d.transaction('exams','readwrite').objectStore('exams').put(v);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function dbDelIDB(id){const d=await db();return new Promise((resolve,reject)=>{const r=d.transaction('exams','readwrite').objectStore('exams').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
// Some browsers block IndexedDB for local file previews. Gracefully fall back to
// the same browser's localStorage, then in-memory demo storage if it too is blocked.
let memoryBackup=[];const BACKUP_KEY='waraqa_fallback_records';
function fallbackRead(){try{return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')}catch{return memoryBackup}}
function fallbackWrite(rows){memoryBackup=rows;try{localStorage.setItem(BACKUP_KEY,JSON.stringify(rows))}catch{toast('⚠️ المتصفح لا يسمح بحفظ البيانات الدائم؛ السجلات مؤقتة هنا')}}
const withDbTimeout=p=>Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('IndexedDB timeout')),900))]);
async function dbAll(){try{return await withDbTimeout(dbAllIDB())}catch{return fallbackRead().sort((a,b)=>b.createdAt-a.createdAt)}}
async function dbPut(v){try{return await withDbTimeout(dbPutIDB(v))}catch{const rows=fallbackRead().filter(x=>x.id!==v.id);rows.push(v);fallbackWrite(rows)}}
async function dbDel(id){try{return await withDbTimeout(dbDelIDB(id))}catch{fallbackWrite(fallbackRead().filter(x=>x.id!==id))}}

</div><aside class="builder-summary"><div class="form-card"><div class="summary-head"><div><div class="muted" style="font-size:12px">إجمالي الأسئلة</div><div class="summary-num">${n}</div></div><div class="circle">📋</div></div><div class="summary-line"><span>المادة</span><b>${E(subjectLabel())}</b></div><div class="summary-line"><span>الصف</span><b>${E(d.grade)}</b></div><div class="summary-line"><span>الحجم</span><b>${E({short:'قصير',medium:'متوسط',final:'نهائي'}[d.size])}</b></div><div class="summary-line"><span>المدة</span><b>${E(d.minutes)} دقيقة</b></div><div class="summary-line"><span>صور الدرس</span><b>${d.images.length}</b></div><div class="summary-tip">✨ كل سؤال تقدر تعدله أو تستبدله بعد التوليد وقبل الطباعة.</div><div class="summary-actions"><button class="btn btn-primary" data-action="generate" ${state.aiAvailable?'':'disabled title="خدمة الذكاء الاصطناعي قيد التفعيل"'}>✨ ${state.aiAvailable?'إنشاء امتحان بالذكاء الاصطناعي':'التوليد الذكي قيد التفعيل'}</button><button class="btn btn-outline" data-action="generate-offline">📝 نموذج من النص بدون AI</button><button class="btn btn-outline" data-action="blank-exam">✍️ ابدأ بورقة فارغة</button></div><p class="mini-note">المعلم لا يدفع رسومًا. خدمة الذكاء الاصطناعي تتطلب تفعيلًا مركزيًا؛ النماذج النصية التجريبية تحتاج مراجعة. السجلات محفوظة في حساب المعلم عند تفعيل الاستضافة.</p></div></aside></div>`}
function getExamTotal(ex){return ex.questions.reduce((a,q)=>a+(Number(q.points)||0),0)}
function paperHTML(ex,answers=false){const groups=[];for(const q of ex.questions){let gr=groups.find(g=>g.type===q.type);if(!gr){gr={type:q.type,questions:[]};groups.push(gr)}gr.questions.push(q)}let no=0;return `<article class="exam-paper"><div class="paper-header"><div class="paper-head-grid"><div><div>المعلم: <strong>${E(ex.teacher)}</strong></div><div>${E(ex.school||'')}</div></div><div class="paper-mid"><b class="paper-title">${E(ex.title)}</b><div>${E(ex.subject)} | ${E(ex.grade)}</div><div>${E(ex.term||'')}</div></div><div class="paper-end"><div>الزمن: ${E(ex.minutes)} دقيقة</div><div>الدرجة: ${E(getExamTotal(ex))}</div></div></div></div><div class="student-line"><span>اسم الطالب: ..................................................</span><span>الفصل: ............</span></div><div class="paper-body">${groups.map((g,j)=>`<section class="q-group"><h4>السؤال ${['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر'][j]||j+1}: ${E(g.type)}</h4>${g.questions.map(q=>`<div class="paper-q"><div class="question-top"><b>${++no}) ${E(q.text)}</b><span class="qpoints">(${E(q.points||1)} درجة)</span></div>${q.options?.filter(Boolean).length?`<div class="paper-options">${q.options.filter(Boolean).map((opt,k)=>`<div>${['أ','ب','ج','د'][k]||k+1}) ${E(opt)}</div>`).join('')}</div>`:''}${q.imageIndex!=null&&ex.images?.[q.imageIndex]?`<img src="${ex.images[q.imageIndex].data}" alt="خريطة أو رسم للسؤال"/>`:''}${answers?`<div style="color:#176f5e;margin:6px 12px;font-weight:700">الإجابة: ${E(q.answer||'يحددها المعلم')}</div>`:(!q.options?.filter(Boolean).length?`<div class="answer-line"></div>${/(مقال|علل|فسر|قارن|تعبير|خريطة|مسائل|Writing)/i.test(q.type)?'<div class="answer-line"></div>':''}`:'')}</div>`).join('')}</section>`).join('')||'<p style="text-align:center;margin-top:50px">ابدأ بإضافة الأسئلة للامتحان</p>'}</div><div class="paper-watermark">تم إعداد الورقة باستخدام ورقة — المنصة التجريبية للمعلم</div></article>`}
function editorHTML(){const ex=state.exam;if(!ex)return `<div class="empty">لا يوجد امتحان مفتوح <button class="btn" data-action="go" data-page="builder">ابدأ امتحان</button></div>`;return `${pageHeading('تحرير ومراجعة','راجع ورقة الامتحان 🔍',` ${E(ex.subject)} · ${E(ex.grade)} · ${ex.questions.length} سؤال`,`<div class="toolbar"><button class="btn btn-outline" data-action="go" data-page="records">السجلات</button><button class="btn btn-primary" data-action="print">🖨️ طباعة / PDF</button></div>`)}<div class="notice blue">✏️ <b>مهم:</b> راجع دقة كل سؤال وإجابته، خصوصًا الخرائط والتواريخ والمصطلحات. لا تعتمد على الأسئلة الناتجة آليًا دون مراجعة.</div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap"><div class="tab-buttons"><button data-action="editor-tab" data-tab="edit" class="${state.editorTab==='edit'?'active':''}">✍️ تعديل الأسئلة</button><button data-action="editor-tab" data-tab="paper" class="${state.editorTab==='paper'?'active':''}">📄 ورقة الطالب</button><button data-action="editor-tab" data-tab="answers" class="${state.editorTab==='answers'?'active':''}">✅ نموذج الإجابة</button></div><span class="questions-count">${ex.questions.length} سؤال • ${getExamTotal(ex)} درجة</span></div>${state.editorTab==='edit'?`<div class="section-grid editor-grid" style="align-items:start"><section><div class="panel"><div class="panel-inner"><div class="panel-title"><h3>الأسئلة (${ex.questions.length})</h3><button data-action="add-question" class="btn btn-subtle btn-sm">+ إضافة سؤال</button></div>${ex.questions.length?ex.questions.map((q,i)=>`<div class="question-editor"><div class="question-editor-top"><span class="subtle-tag">سؤال ${i+1}</span><div class="editor-actions"><button class="btn btn-outline btn-sm" data-action="move-q" data-index="${i}" data-move="-1" title="تحريك لأعلى">↑</button><button class="btn btn-outline btn-sm" data-action="move-q" data-index="${i}" data-move="1" title="تحريك لأسفل">↓</button><button class="btn btn-danger btn-sm" data-action="delete-q" data-index="${i}">حذف</button></div></div><div class="form-field"><label>نوع السؤال</label><input class="field" value="${E(q.type)}" data-q="type" data-qi="${i}" /></div><div class="form-field spaced"><label>نص السؤال</label><textarea class="textarea" rows="2" data-q="text" data-qi="${i}">${E(q.text)}</textarea></div><div class="grid-2 spaced"><div class="form-field"><label>الإجابة النموذجية</label><textarea rows="2" class="textarea" data-q="answer" data-qi="${i}">${E(q.answer||'')}</textarea></div><div><div class="form-field"><label>الدرجة</label><input class="field" type="number" min="0.25" step="0.25" value="${E(q.points)}" data-q="points" data-qi="${i}" /></div><div class="form-field spaced"><label>صورة أو خريطة مرفقة بالسؤال</label><select class="select" data-q="imageIndex" data-qi="${i}"><option value="">بدون صورة</option>${(ex.images||[]).map((im,j)=>`<option value="${j}" ${q.imageIndex===j?'selected':''}>صورة ${j+1}: ${E(im.name.slice(0,23))}</option>`).join('')}</select></div></div></div><div class="form-field spaced"><label>اختيارات السؤال (سطر لكل اختيار، واتركها فارغة لغير الاختياري)</label><textarea rows="3" class="textarea" data-q="options" data-qi="${i}" placeholder="الاختيار الأول&#10;الاختيار الثاني&#10;الاختيار الثالث&#10;الاختيار الرابع">${E((q.options||[]).join('\n'))}</textarea></div></div>`).join(''):`<div class="empty">ابدأ بإضافة سؤال</div>`}<button class="btn btn-subtle" data-action="add-question">+ إضافة سؤال جديد</button></div></div></section><aside><div class="form-card"><h3 style="margin:0 0 15px;font-size:16px">حفظ وطباعة</h3><p class="mini-note">تقدر تعدل الأسئلة والأجوبة، ثم تحفظ التعديلات في السجلات.</p><div class="summary-actions"><button class="btn btn-primary" data-action="save-exam">💾 حفظ التعديلات</button><button class="btn btn-outline" data-action="print">🖨️ طباعة الامتحان</button><button class="btn btn-outline" data-action="print-answers">✅ طباعة الإجابات</button></div></div></aside></div>`:`<div class="toolbar" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" data-action="print">🖨️ طباعة ورقة الطالب</button><button class="btn btn-outline btn-sm" data-action="print-answers">📑 طباعة نموذج الإجابة</button></div>${paperHTML(ex,state.editorTab==='answers')}`}`}
function recordsHTML(){const r=state.records.filter(e=>!state.recordFilter||(e.title+' '+e.subject+' '+e.grade+' '+e.teacher).toLowerCase().includes(state.recordFilter.toLowerCase()));return `${pageHeading('أرشيف المعلم','سجلات الامتحانات 🗂️','كل امتحان بتعمله محفوظ هنا على نفس الجهاز والمتصفح.',`<button class="btn btn-primary" data-action="go" data-page="builder">+ امتحان جديد</button>`)}<div class="notice blue">🔒 السجلات محفوظة محليًا على هذا المتصفح فقط. في النسخة المنشورة هنربطها بحساب المعلم، وتكون متاحة له من أجهزته المختلفة بعد تسجيل دخول حقيقي.</div><div class="panel"><div class="panel-inner"><div class="panel-title"><h3>امتحاناتي (${r.length})</h3></div><div class="filters"><input id="records-filter" class="field" placeholder="🔎 ابحث باسم الامتحان أو المادة..." value="${E(state.recordFilter)}" /></div>${r.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>الامتحان</th><th>المادة والصف</th><th>الأسئلة</th><th>تاريخ الإنشاء</th><th>إجراءات</th></tr></thead><tbody>${r.map(e=>`<tr><td><b>${E(e.title)}</b><br><small class="muted">${E(e.teacher)}</small></td><td>${E(e.subject)}<br><small class="muted">${E(e.grade)}</small></td><td>${e.questions.length}</td><td>${new Date(e.createdAt).toLocaleDateString('ar-EG')}</td><td><div class="toolbar"><button class="btn btn-outline btn-sm" data-action="open-record" data-id="${E(e.id)}">فتح</button><button class="btn btn-outline btn-sm" data-action="print-record" data-id="${E(e.id)}">طباعة</button><button class="btn btn-danger btn-sm" data-action="delete-record" data-id="${E(e.id)}">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🗃️</div><strong>${state.recordFilter?'مفيش نتائج للبحث':'لسه مفيش امتحانات محفوظة'}</strong><p>الامتحانات اللي هتعملها هتظهر هنا.</p><button class="btn btn-subtle" data-action="go" data-page="builder">أنشئ امتحان</button></div>`}</div></div>`}

function seededGenerate(d){const sentences=d.lesson.replace(/\r/g,' ').split(/[.!؟؛\n]+/).map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.length>18);if(!sentences.length)throw new Error('اكتب جملًا من الدرس، أو اربط الذكاء الاصطناعي لقراءة صور الدرس.');const stop=new Set(['الذي','التي','وهذا','وهذه','هناك','كانت','يمكن','يكون','علينا','الدرس','تعتبر','بسبب','حيث','لذلك','وهناك','توجد','يساعد','يسمى','تكون','خلال']);const concepts=[...new Set(sentences.flatMap(s=>s.split(/\s+/)).map(w=>w.replace(/[^\p{L}\p{N}]/gu,'')).filter(w=>w.length>4&&!stop.has(w)))].slice(0,20);const types=Object.entries(d.counts).flatMap(([type,n])=>Array.from({length:Math.min(35,Number(n)||0)},()=>type));const questions=types.map((type,i)=>{const s=sentences[i%sentences.length],words=s.split(' ').filter(w=>w.length>3),word=words[Math.min(2,words.length-1)]||'المفهوم',eng=/Choose|Vocabulary|Grammar|Reading|Writing|Complete|Rearrange|Choisissez|Grammaire/.test(type),mcq=/اختر|Choose|Choisissez|Vocabulary/.test(type),tf=/صح أم خطأ/.test(type),blank=/أكمل|Complete/.test(type),map=/خريطة|خرائط|رسومات/.test(type),compare=/قارن|مقارن/.test(type),why=/فسر|علل|النتائج|مترتبة/.test(type);let text='',answer=s,options=[];if(mcq){text=eng?`Choose the word mentioned in this lesson statement: «${s}»`:`اختر الكلمة الواردة في العبارة الآتية من الدرس: «${s}»`;const alternatives=concepts.filter(c=>c!==word&&!s.includes(c)).slice(i%3,i%3+3);options=[word,...alternatives];while(options.length<4)options.push('خيار يحتاج تعديل');options=options.sort((a,b)=>String(a).localeCompare(String(b)));answer=word}else if(blank){text=s.replace(word,'...................');answer=word}else if(tf){text=`ضع علامة (✓) أو (✗) أمام العبارة: ${s}`;answer='صح (بحسب نص الدرس)'}else if(map){text=`استعن بالخريطة أو الرسم الخاص بالدرس، ثم حدّد ما يرتبط بالعبارة الآتية: ${s}`;answer=`راجع الرسم المرفق: ${s}`}else if(compare){text=`قارن بين مفهومين أو عنصرين مرتبطين بالعبارة التالية كما وردا في الدرس: ${s}`;answer='يحدد المعلم العنصرين وال   <script>
/* Waraqa production integration. The preview remains clearly labeled local-only. */
'use strict';
let supabaseClient = null;
let cloudMode = false;
let serviceConfig = null;
const localDbAll = dbAll;
const localDbPut = dbPut;
const localDbDel = dbDel;
const originalSettingsHTML = settingsHTML;
const originalRecordsHTML = recordsHTML;

function userFromAuth(user) {
  return {
    ownerId: user.id,
    name: String(user.user_metadata?.full_name || user.email?.split('@')[0] || 'المعلم').slice(0,80),
    email: user.email || ''
  };
}

async function refreshTeacherRecords() {
  if (!state.user) { state.records = []; return; }
  try { state.records = (await dbAll()).filter(e => e.ownerId === state.user.ownerId); }
  catch (error) { state.records = []; toast('تعذر تحميل الامتحانات: ' + error.message); }
}

async function initializeProduction() {
  state.user = null;
  render();
  let config = null;
  try {
    const abort = new AbortController();
    const timer = setTimeout(() => abort.abort(), 6000);
    const response = await fetch('/api/config', { signal: abort.signal, cache: 'no-store' });
    clearTimeout(timer);
    if (response.ok && response.headers.get('content-type')?.includes('application/json')) {
      config = await response.json();
    }
  } catch { /* Static file and GitHub preview have no API. */ }
  serviceConfig = config;
  cloudMode = !!(config?.authConfigured && config?.supabaseUrl && config?.supabaseKey);
  state.aiAvailable = !!(cloudMode && config?.aiConfigured);
  state.authView = 'login';
  if (cloudMode) {
    if (!window.supabase?.createClient) {
      state.authError = 'تعذر تحميل مكتبة تسجيل الدخول. تحقق من الإنترنت وأعد تحميل الصفحة.';
      render(); return;
    }
    try {
      supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      const { data, error } = await supabaseClient.auth.getUser();
      if (!error && data?.user) {
        state.user = userFromAuth(data.user);
        state.draft.teacher = state.user.name;
        await refreshTeacherRecords();
      }
      // Don't make asynchronous API calls *inside* the auth listener.
      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') {
          state.user = null; state.records = []; state.exam = null;
          state.page = 'dashboard'; render();
        }
      });
    } catch (error) {
      state.authError = 'فشل الاتصال بحسابات المعلمين: ' + error.message;
    }
  } else {
    state.user = localUser();
    if (state.user) {
      state.draft.teacher = state.user.name;
      await refreshTeacherRecords();
    }
  }
  render();
}

async function getAccessToken() {
  if (!cloudMode || !supabaseClient) throw new Error('الخادم الخاص بحسابات المعلمين غير متصل');
  const { data, error } = await supabaseClient.auth.getSession();
  if (error || !data.session?.access_token) throw new Error('سجل الدخول بحسابك مرة أخرى');
  return data.session.access_token;
}

async function aiHeaders() {
  return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await getAccessToken() };
}

async function loginOrRegister(event) {
  if (event?.preventDefault) event.preventDefault();
  const name = ($('#login-name')?.value || '').trim();
  const email = ($('#login-email')?.value || '').trim().toLowerCase();
  const password = $('#login-password')?.value || '';
  if (cloudMode) {
    if (!supabaseClient) return toast('حسابات المعلمين غير متاحة حاليًا. أعد فتح الموقع.');
    if (!email) return toast('اكتب البريد الإلكتروني');
    if (password.length < 8) return toast('كلمة المرور يجب أن تكون 8 أحرف على الأقل');
    const signup = state.authView === 'signup';
    if (signup && name.length < 2) return toast('اكتب اسم المعلم');
    busy(true, signup ? 'جارٍ إنشاء حساب المعلم...' : 'جارٍ تسجيل الدخول...');
    try {
      const response = signup
        ? await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } })
        : await supabaseClient.auth.signInWithPassword({ email, password });
      if (response.error) throw response.error;
      if (signup && !response.data?.session) {
        state.authView = 'login';
        state.authError = 'تم إرسال رسالة لتأكيد بريدك الإلكتروني. افتحها ثم سجل الدخول.';
        render(); return;
      }
      const user = response.data?.user;
      if (!user) throw new Error('لم يتم تسجيل الدخول؛ راجع بريدك الإلكتروني');
      state.user = userFromAuth(user);
      state.draft.teacher = state.user.name;
      state.page = 'dashboard';
      state.authError = '';
      await refreshTeacherRecords();
      render(); toast('أهلًا بك في ورقة! 🌟');
    } catch (error) {
      state.authError = error.message || 'تعذر إتمام تسجيل الدخول';
      render();
    } finally { busy(false); }
  } else {
    if (name.length < 2) return toast('اكتب اسم المعلم');
    const ownerId = (email || name).trim().toLowerCase();
    state.user = {name, email, ownerId};
    try { localStorage.setItem('waraqa_teacher', JSON.stringify(state.user)); } catch {}
    await refreshTeacherRecords();
    state.draft.teacher = name;
    render(); toast('أهلًا بك في المعاينة المحلية.');
  }
}

async function requestPasswordReset() {
  if (!cloudMode || !supabaseClient) return toast('الاستعادة متاحة للحسابات الحقيقية فقط');
  const email = ($('#login-email')?.value || '').trim();
  if (!email) return toast('اكتب بريدك الإلكتروني أولًا');
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  toast(error ? 'تعذر إرسال رابط الاستعادة: '+error.message : 'لو البريد مسجّل، ستصلك رسالة استعادة كلمة المرور.');
}

async function signOutTeacher() {
  stopScenes();
  if (cloudMode && supabaseClient) {
    await supabaseClient.auth.signOut();
  } else {
    try { localStorage.removeItem('waraqa_teacher'); } catch {}
  }
  state.user = null;
  state.exam = null;
  state.records = [];
  state.draft = makeDraft();
  render();
}

async function updateTeacherSettings() {
  const name = ($('#settings-name')?.value || '').trim();
  const email = ($('#settings-email')?.value || '').trim();
  if (name.length < 2) return toast('اكتب اسم معلم صحيح');
  if (cloudMode) {
    const {error} = await supabaseClient.auth.updateUser({data:{full_name:name}});
    if (error) return toast('تعذر تعديل الاسم: ' + error.message);
    state.user = {...state.user, name};
    toast('تم حفظ اسم المعلم. تغيير البريد الإلكتروني من إعدادات حسابك لاحقًا.');
  } else {
    state.user={...state.user,name,email};
    try {localStorage.setItem('waraqa_teacher',JSON.stringify(state.user));} catch {}
    toast('تم حفظ بيانات المعاينة');
  }
  state.draft.teacher = name;
  render();
}

function blobFromDataUri(uri) {
  const match = String(uri).match(/^data:(image\/(?:png|jpeg|webp));base64,([A-Za-z0-9+/=]+)$/);
  if (!match) throw new Error('إحدى الصور غير مدعومة');
  const binary=atob(match[2]),out=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)out[i]=binary.charCodeAt(i);
  return new Blob([out],{type:match[1]});
}

async function cloudAll() {
  const {data,error}=await supabaseClient.from('exams').select('payload').order('created_at',{ascending:false}).limit(250);
  if(error)throw new Error(error.message);
  return (data||[]).map(x=>x.payload).filter(x=>x?.ownerId===state.user?.ownerId);
}

async function cloudPut(exam) {
  if (!state.user?.ownerId) throw new Error('سجل دخولك أولًا');
  const uid=state.user.ownerId;
  const images=[];
  for(let i=0;i<(exam.images||[]).length;i++){
    const im=exam.images[i];
    const storagePath=im.storagePath || `${uid}/${exam.id}/${i}.jpg`;
    if(im.data?.startsWith('data:')){
      const blob=blobFromDataUri(im.data);
      if(blob.size>1_950_000)throw new Error('صورة كبيرة جدًا. حاول التقاط صورة أوضح بحجم أصغر.');
      const {error}=await supabaseClient.storage.from('exam-images').upload(storagePath,blob,{upsert:true,contentType:blob.type});
      if(error)throw new Error('تعذر تخزين صورة الدرس: '+error.message);
    }
    images.push({name:String(im.name||`صورة ${i+1}`).slice(0,70),storagePath});
  }
  const payload={...exam,ownerId:uid,images};
  if(JSON.stringify(payload).length>280000)throw new Error('الامتحان كبير جدًا للحفظ. قلل عدد الأسئلة.');
  const {error}=await supabaseClient.from('exams').upsert({id:exam.id,user_id:uid,payload},{onConflict:'id'});
  if(error)throw new Error('تعذر حفظ الامتحان: '+error.message);
}

async function cloudDel(id) {
  const record=state.records.find(x=>x.id===id);
  const paths=(record?.images||[]).map(x=>x.storagePath).filter(Boolean);
  if(paths.length) {
    const {error}=await supabaseClient.storage.from('exam-images').remove(paths);
    if(error)console.warn('Could not delete some image objects');
  }
  const {error}=await supabaseClient.from('exams').delete().eq('id',id);
  if(error)throw new Error('تعذر حذف الامتحان: '+error.message);
}

async function hydrateExam(ex) {
  const clone=structuredClone(ex);
  if(!cloudMode)return clone;
  clone.images=await Promise.all((clone.images||[]).map(async im=>{
    if(!im.storagePath)return im;
    const {data,error}=await supabaseClient.storage.from('exam-images').createSignedUrl(im.storagePath,3600);
    if(error)return {...im,data:''};
    return {...im,data:data.signedUrl};
  }));
  return clone;
}

dbAll=async function() {return cloudMode?cloudAll():localDbAll();};
dbPut=async function(record) {return cloudMode?cloudPut(record):localDbPut(record);};
dbDel=async function(id) {return cloudMode?cloudDel(id):localDbDel(id);};
