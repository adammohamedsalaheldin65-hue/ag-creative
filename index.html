<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<meta name="description" content="AG Creative — تصميمات السوشيال ميديا والإعلانات. تصفح الأعمال وتابعنا على إنستجرام وتيك توك.">
<title>AG Creative | تصميمات سوشيال ميديا</title>
<style>body{background:#101114;color:#f9fbf4;font:16px Tahoma,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#d0fb68}p{line-height:2}</style>
</head>
<body>
<div id="loading"><h1>AG<span style="color:#d0fb68">.</span> CREATIVE</h1><p>جارٍ فتح الموقع...</p><a href="./original.html">افتح النسخة الأصلية مباشرة</a></div>
<script>
(async function () {
  const originalPath = './original.html';
  const tiktokURL = 'https://www.tiktok.com/@ag.creative0';
  try {
    const response = await fetch(originalPath);
    if (!response.ok) throw new Error('Could not load original site');
    let html = await response.text();
    const instagramContact = '<a class="pill instagram-link" href="https://www.instagram.com/agcreative.eg/" target="_blank" rel="noopener noreferrer">راسلنا على إنستجرام ↗</a>';
    const instagramFooter = '<a class="instagram-link" href="https://www.instagram.com/agcreative.eg/" target="_blank" rel="noopener noreferrer">INSTAGRAM ↗</a>';
    const navContact = '<a href="#contact">تواصل معنا</a></nav>';
    if (!html.includes(instagramContact) || !html.includes(instagramFooter) || !html.includes(navContact)) throw new Error('Original site layout changed');
    html = html.replace(instagramContact, '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">' + instagramContact + '<a class="pill secondary" href="' + tiktokURL + '" target="_blank" rel="noopener noreferrer" aria-label="زوروا حساب AG Creative على تيك توك">تابعنا على تيك توك ↗</a></div>');
    html = html.replace(instagramFooter, instagramFooter + '<a href="' + tiktokURL + '" target="_blank" rel="noopener noreferrer" aria-label="AG Creative TikTok">TIKTOK ↗</a>');
    html = html.replace(navContact, '<a href="#contact">تواصل معنا</a><a href="' + tiktokURL + '" target="_blank" rel="noopener noreferrer">تيك توك ↗</a></nav>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('loading').innerHTML = '<h1>AG Creative</h1><p>يمكنك فتح الموقع الأصلي أو حساب تيك توك من هنا.</p><p><a href="' + originalPath + '">افتح الموقع الأصلي</a> · <a href="' + tiktokURL + '" target="_blank" rel="noopener noreferrer">تيك توك</a></p>';
  }
})();
</script>
</body>
</html>
